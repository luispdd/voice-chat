<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Web Voice Bot</title>
    <link rel="stylesheet" href="static/style.css?v=4">
</head>
<body>

<div class="card">
    <h2>Offline AI Companion</h2>
    
    <div class="network-banner">
        Connected via: <strong>https://__HOST_IP__:__PORT__</strong> | Engine: <strong>__ENGINE__</strong> (<strong>__MODEL__</strong>)
    </div>

    <div id="chatLog" class="chat-log"></div>
    
    <div class="controls">
        <button id="actionBtn">Start Hands-Free Session</button>
        <button id="cancelBtn" class="cancel-btn" style="display: none;">Cancel Request</button>
        
        <div class="vumeter-container">
            <div id="vumeter" class="vumeter"></div>
        </div>

        <div class="sensitivity-control">
            <span>Sensitivity: <strong id="sensitivityVal">High</strong></span>
            <input type="range" id="sensitivitySlider" min="1" max="5" value="4" step="1" title="Adjust voice detection sensitivity">
        </div>

        <div id="status" class="status">Microphone ready</div>
        <div id="metrics" class="metrics"></div>
    </div>
    
    <audio id="audioPlayback" autoplay></audio>
</div>

<script src="static/app.js?v=4"></script>
</body>
</html>
