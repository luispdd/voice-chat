<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Voice Reader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #1e1b4b);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="file"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-right: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        input[type="file"]::file-selector-button:hover {
            background: var(--primary-hover);
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary-color), #8b5cf6);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .audio-container {
            margin-top: 2rem;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
            outline: none;
        }
        
        .error-message {
            color: #ef4444;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>PDF Voice Reader</h1>
        <p class="subtitle">Upload a PDF to generate a narrated audio track</p>

        <form id="uploadForm">
            <div class="form-group">
                <label for="pdfFile">PDF Document</label>
                <input type="file" id="pdfFile" name="file" accept="application/pdf" required>
            </div>

            <div class="form-group">
                <label for="startPage">Start Page</label>
                <input type="number" id="startPage" name="start_page" value="1" min="1" required>
            </div>

            <div class="form-group">
                <label for="llmEngine">LLM Engine (Optional)</label>
                <select id="llmEngine" name="llm_engine">
                    <option value="None">None (Direct Reading)</option>
                    <option value="ollama">Ollama (Local)</option>
                    <option value="lm-studio">LM-Studio (Local)</option>
                </select>
            </div>

            <div class="form-group" id="modelGroup" style="display: none;">
                <label for="llmModel">LLM Model Name</label>
                <input type="text" id="llmModel" name="llm_model" value="llama2" placeholder="e.g. llama2">
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">Generate Audio</span>
                <div class="loader" id="loader"></div>
            </button>
            
            <div id="errorMessage" class="error-message"></div>
        </form>

        <div class="audio-container" id="audioContainer">
            <label>Generated Audio:</label>
            <audio id="audioPlayer" controls></audio>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const llmEngineSelect = document.getElementById('llmEngine');
        const modelGroup = document.getElementById('modelGroup');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const errorMessage = document.getElementById('errorMessage');

        llmEngineSelect.addEventListener('change', (e) => {
            if (e.target.value === 'None') {
                modelGroup.style.display = 'none';
            } else {
                modelGroup.style.display = 'block';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset state
            errorMessage.style.display = 'none';
            audioContainer.style.display = 'none';
            
            const fileInput = document.getElementById('pdfFile');
            if (!fileInput.files.length) return;

            const formData = new FormData(form);
            
            // UI Loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Processing...';
            loader.style.display = 'block';

            try {
                const response = await fetch('/read-pdf', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(text || `Error ${response.status}: Failed to process PDF`);
                }

                // Get audio blob
                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                
                audioPlayer.src = audioUrl;
                audioContainer.style.display = 'block';
                
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Generate Audio';
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
