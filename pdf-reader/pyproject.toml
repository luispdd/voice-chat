[project]
name = "pdf-reader"
version = "0.1.0"
description = "A PDF reader with optional LLM processing and TTS narration."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "huggingface-hub>=1.16.4",
    "numpy>=2.4.5",
    "openai>=2.37.0",
    "piper-tts>=1.4.2",
    "python-multipart>=0.0.29",
    "soundfile>=0.13.1",
    "uvicorn>=0.47.0",
    "pypdf>=5.1.0",
]
